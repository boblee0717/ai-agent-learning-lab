name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Course tests
        run: pytest -q

      - name: Exercise auto-graders against reference solutions
        # Copy each reference solution into the matching starter slot, then
        # run the autograder. This proves the autograder + solutions stay
        # consistent across OSes (catches CRLF / path / fsync regressions).
        shell: python
        run: |
          import shutil
          from pathlib import Path

          starter = Path("exercises/starter")
          solutions = Path("exercises/solutions")
          for src in solutions.glob("ex*.py"):
              shutil.copyfile(src, starter / src.name)

      - name: Run exercise tests
        run: pytest exercises/tests -q
